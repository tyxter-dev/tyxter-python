[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tyxter"
version = "0.1.0a0"
description = "Python SDK for the Tyxter Messaging API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tyxter" }]
keywords = ["tyxter", "whatsapp", "messaging", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://docs.tyxter.com"
Repository = "https://github.com/tyxter/tyxter-messaging"

[tool.hatch.build.targets.wheel]
packages = ["src/tyxter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
