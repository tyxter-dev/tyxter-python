[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tyxter"
dynamic = ["version"]
description = "Python SDK for the Tyxter Messaging API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyxter" }]
keywords = ["tyxter", "whatsapp", "messaging", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.26,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://docs.tyxter.com"
Repository = "https://github.com/tyxter/tyxter-messaging"

[tool.hatch.build.targets.wheel]
packages = ["src/tyxter"]

[tool.hatch.version]
path = "src/tyxter/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true
